spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: localhost
      port: 6379

mercadox:
  jpa:
    enabled: true

security:
  jwt:
    private-key-location: file:./secrets/private.pem
    public-key-location: file:./secrets/public.pem
    expiration: 1h
    key-id: rsa-test-1

logging:
  level:
    org.hibernate.SQL: warn
