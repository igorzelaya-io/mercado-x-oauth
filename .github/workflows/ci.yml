name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: igorzelaya-io/mercado-x-parent/.github/workflows/maven-ci.yml@6da451055278f597ee70c216bddc26504d0f310d
    with:
      sonar_host_url: ${{ vars.SONAR_HOST_URL }}
      sonar_organization: ${{ vars.SONAR_ORGANIZATION }}
      sonar_project_key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
